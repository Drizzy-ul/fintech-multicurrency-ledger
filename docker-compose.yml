version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: fintech_postgres
    environment:
      POSTGRES_USER: fintech_user
      POSTGRES_PASSWORD: fintech_secret_password
      POSTGRES_DB: fintech_ledger_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fintech_user -d fintech_ledger_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis Cache & Celery Message Broker
  redis:
    image: redis:7-alpine
    container_name: fintech_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FastAPI Web Service
  api:
    build: .
    container_name: fintech_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://fintech_user:fintech_secret_password@postgres:5432/fintech_ledger_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - STORAGE_DIR=/app/storage/statements
    volumes:
      - .:/app
      - statement_storage:/app/storage/statements
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Celery Background Worker for PDF Statements
  worker:
    build: .
    container_name: fintech_celery_worker
    command: celery -A app.tasks.celery_app.celery_app worker --loglevel=info -c 2
    environment:
      - DATABASE_URL=postgresql://fintech_user:fintech_secret_password@postgres:5432/fintech_ledger_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - STORAGE_DIR=/app/storage/statements
    volumes:
      - .:/app
      - statement_storage:/app/storage/statements
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  statement_storage:
